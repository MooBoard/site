<!doctype html>
<html><head><meta charset="utf-8"><title>icon</title>
<style>html,body{margin:0;background:transparent}
.t{width:180px;height:180px;background:#0E1A22;display:grid;place-items:center}.t img{width:150px}
.f{width:32px;height:32px;display:grid;place-items:center}.f img{width:32px}
body.fav .t{display:none} body:not(.fav) .f{display:none}</style></head>
<body><div class="t"><img src="../brand/mark-sky.svg"></div><div class="f"><img src="../brand/mark-sky.svg"></div>
<script>if(location.hash=='#fav')document.body.className='fav'</script></body></html>
